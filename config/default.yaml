# ============================================================
# Research LLM - Default Configuration
# ============================================================

# ----- Data -----
data:
  parquet_dir: "./data/fineweb-edu/sample/10BT"
  text_column: "text"                      # Column name with raw text
  train_split: 0.95                        # Fraction used for training
  val_split: 0.05                          # Fraction used for validation
  min_text_length: 100                     # Min characters to keep a document
  max_text_length: 100000                  # Max characters (longer docs are chunked)
  shuffle_seed: 42
  num_workers: 0                           # Start with one stream on macOS
  prefetch_factor: 2

# ----- Tokenizer -----
tokenizer:
  type: "sentencepiece"                    # "sentencepiece" | "bpe"
  vocab_size: 32000
  model_path: "./tokenizer/spm.model"
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3
  character_coverage: 0.9995              # SentencePiece coverage
  model_type: "bpe"                        # SentencePiece model type: bpe | unigram
  max_sentence_length: 16384              # Max chars per sentence for training
  num_threads: 16
  train_on_n_docs: 2000000               # How many docs to use for vocab training

# ----- One-time corpus tokenization / benchmarking -----
tokenization:
  mode: "sequential"                      # sequential reference | hybrid CPU processes
  output_dir: null                         # null = data.parquet_dir; use outputs/ for a bounded benchmark
  max_tokens: null                         # null = full split; otherwise stop after this many tokens per split
  max_docs_per_file: null                  # null = full file; bounded benchmark across every source file
  profile_path: null                       # null = output_dir/tokenization_profile.json
  log_every_docs: 50000                    # Rolling throughput log interval per source file
  workers: 4                               # Hybrid worker processes (each loads its own tokenizer)
  chunk_docs: 1024                         # Ordered documents per validation task
  max_pending: 8                           # Maximum submitted tasks, including running tasks
  write_buffer_tokens: 100000              # Buffered uint16 tokens per worker flush

# ----- Model -----
model:
  # Sizes: nano | small | medium | large | xl
  preset: "nano"
  # Explicit model architecture (set to null to use preset)
  n_layers: null
  n_heads: null
  n_kv_heads: null                         # null = same as n_heads (MHA), or set for GQA
  d_model: null
  d_ff: null
  context_length: null
  vocab_size: null                         # Auto-set from tokenizer if null
  dropout: 0.1
  bias: false                              # Use bias in Linear layers
  rope_base: 10000                         # RoPE theta base
  norm_eps: 1.0e-5
  tie_embeddings: true                     # Tie input/output embeddings

# ----- Training -----
training:
  output_dir: "./checkpoints"
  log_dir: "./logs"
  run_name: "research_llm"

  # Batch / sequence
  batch_size: 2
  grad_accumulation_steps: 8
  context_length: null                    # null = use model.context_length

  # Optimizer
  optimizer: "adamw"
  learning_rate: 3.0e-4
  min_lr: 3.0e-5                          # Min LR for cosine decay
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eps: 1.0e-8

  # Schedule
  scheduler: "cosine_with_warmup"         # cosine_with_warmup | constant | linear
  warmup_steps: 2000
  max_steps: 100000                        # Total training steps
  decay_steps: null                        # null = max_steps

  # Mixed precision
  dtype: "float32"                         # Portable MPS starting point

  # Checkpointing
  save_every_n_steps: 1000
  keep_last_n_checkpoints: 3
  resume_from: null                        # Path to checkpoint to resume from

  # Evaluation
  eval_every_n_steps: 500
  eval_steps: 100                          # Number of val batches per evaluation
  generate_every_n_steps: 1000

  # Logging
  log_every_n_steps: 10
  wandb:
    enabled: false
    project: "research-llm"
    entity: null

# ----- Inference / Generation -----
inference:
  checkpoint_path: "./checkpoints/best.pt"
  max_new_tokens: 512
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  repetition_penalty: 1.1
  batch_size: 1

# ----- System -----
system:
  seed: 42
  device: "mps"                            # Apple GPU; cpu for debugging
